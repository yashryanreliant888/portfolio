# Supabase CLI Configuration
# Documentation: https://supabase.com/docs/reference/cli/config

project_id = "bdteruwmfewuidtgkjib"

[api]
enabled = true
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API endpoints.
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
port = 54323
ip_version = "ipv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Seed your database with initial data
[db.seed]
enabled = true
# Files run in order: numbered files in seeds/ folder
sql_paths = [
  "./seeds/001_profile_and_skills.sql",
  "./seeds/002_education_and_experience.sql",
  "./seeds/003_certifications.sql",
  "./seeds/004_projects.sql",
  "./seeds/005_gallery.sql"
]
